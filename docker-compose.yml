services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_api}
    ports:
      - '${HOST_DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ticket} -d ${POSTGRES_DB:-ticket_api}']
      interval: 5s
      timeout: 3s
      retries: 10

  ticket-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-ticket}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ticket_api}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-10}
      RESERVATION_EXPIRY_INTERVAL_SECONDS: ${RESERVATION_EXPIRY_INTERVAL_SECONDS:-60}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  postgres_data:
