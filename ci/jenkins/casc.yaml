# Configuración de Jenkins como código (JCasC). Se aplica en cada arranque.
jenkins:
  systemMessage: 'CI/CD local de ticket-api (ver docs/ci-cd.md)'
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: http://127.0.0.1:8081/

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

credentials:
  system:
    domainCredentials:
      - credentials:
          # El .env de despliegue (montado en solo lectura desde la raíz del repo)
          - file:
              scope: GLOBAL
              id: ticket-api-env
              description: '.env de despliegue de ticket-api'
              fileName: ticket-api.env
              secretBytes: ${readFileBase64:/run/secrets/ticket-api.env}

jobs:
  # El disparador va en el job y no en el Jenkinsfile: así funciona desde el primer commit
  - script: |
      pipelineJob('ticket-api') {
        description('Pipeline de ticket-api: verificaciones, imagen, smoke test y despliegue local')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM {
                scmpoll_spec('H/2 * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///repos/ticket_backend_api')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
